<div class="contenedor">
  <h2>Registro de Egresado</h2>
  <p class="subtitulo">Universidad del Pacífico — Buenaventura</p>

  <div *ngIf="mensajeExito" class="exito">{{ mensajeExito }}</div>

  <form [formGroup]="formulario" (ngSubmit)="guardar()">

    <div class="campo">
      <label for="nombres">Nombres *</label>
      <input id="nombres" formControlName="nombres" />
      <span *ngIf="campoInvalido('nombres')" class="error">Campo obligatorio.</span>
    </div>

    <div class="campo">
      <label for="apellidos">Apellidos *</label>
      <input id="apellidos" formControlName="apellidos" />
      <span *ngIf="campoInvalido('apellidos')" class="error">Campo obligatorio.</span>
    </div>

    <div class="campo">
      <label for="direccion">Dirección *</label>
      <input id="direccion" formControlName="direccion" />
      <span *ngIf="campoInvalido('direccion')" class="error">Campo obligatorio.</span>
    </div>

    <div class="campo">
      <label for="edad">Edad *</label>
      <input id="edad" type="number" formControlName="edad" />
      <span *ngIf="campoInvalido('edad')" class="error">Edad mínima 18 años.</span>
    </div>

    <div class="campo">
      <label for="fechaGraduacion">Fecha de Graduación *</label>
      <input id="fechaGraduacion" type="date" formControlName="fechaGraduacion" />
      <span *ngIf="campoInvalido('fechaGraduacion')" class="error">Campo obligatorio.</span>
    </div>

    <div class="campo">
      <label for="idPrograma">Programa *</label>
      <select id="idPrograma" formControlName="idPrograma">
        <option *ngFor="let p of programas" [value]="p.id">{{ p.nombre }}</option>
      </select>
    </div>

    <fieldset>
      <legend>Ubicación</legend>

      <div class="campo">
        <label for="idDepartamento">Departamento *</label>
        <select id="idDepartamento" formControlName="idDepartamento">
          <option *ngFor="let d of departamentos" [value]="d.id">{{ d.nombre }}</option>
        </select>
      </div>

      <div class="campo">
        <label for="idCiudad">Ciudad *</label>
        <select id="idCiudad" formControlName="idCiudad">
          <option *ngFor="let c of ciudades" [value]="c.id">{{ c.nombre }}</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Situación Laboral</legend>

      <div class="campo-radio">
        <label>¿Trabaja actualmente? *</label>
        <label><input type="radio" formControlName="trabajaActualmente" [value]="true" /> Sí</label>
        <label><input type="radio" formControlName="trabajaActualmente" [value]="false" /> No</label>
      </div>

      <div class="campo" *ngIf="formulario.get('trabajaActualmente')!.value">
        <label for="empresa">Empresa *</label>
        <input id="empresa" formControlName="empresa" />
        <span *ngIf="campoInvalido('empresa')" class="error">Campo obligatorio cuando trabaja.</span>
      </div>
    </fieldset>

    <button type="submit">Guardar</button>
  </form>
</div>
